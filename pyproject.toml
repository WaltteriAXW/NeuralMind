[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralmind"
version = "0.1.0"
description = "A non-LLM neurosymbolic reasoning system: neural perception, symbolic inference, proof-tree explanations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NeuralMind contributors" }]
keywords = ["neurosymbolic", "reasoning", "datalog", "asp", "answer-set-programming", "explainable-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# Authoritative ASP backend (MIT). Needed for choice rules, aggregates,
# optimisation and unstratified negation -- not for the core Datalog engine.
asp = ["clingo>=5.6"]
# Knowledge-graph import/export (BSD-3).
rdf = ["rdflib>=6.0"]
# Neural perception layers.
numeric = ["numpy>=1.23"]
text = ["spacy>=3.5"]
vision = ["torch>=2.0"]
# Workspace specialists. Each is genuinely optional: without it, the questions
# it would have answered come back "unknown" naming what is missing, and
# nothing else changes.
arithmetic = ["z3-solver>=4.12"]
units = ["pint>=0.20"]
graph = ["networkx>=3.0"]
specialists = ["z3-solver>=4.12", "pint>=0.20", "networkx>=3.0"]
# Interactive environments the school measures action and time in (P2.7).
# Neither is imported anywhere else; without them those stages report
# themselves unavailable rather than being absent.
games = ["minigrid>=2.3", "textworld>=1.6"]
dev = [
  "pytest>=7.0", "numpy>=1.23", "rdflib>=6.0",
  "z3-solver>=4.12", "pint>=0.20", "networkx>=3.0",
]
all = [
  "clingo>=5.6", "rdflib>=6.0", "numpy>=1.23",
  "z3-solver>=4.12", "pint>=0.20", "networkx>=3.0",
]

[project.scripts]
neuralmind = "neuralmind.cli:main"

[tool.setuptools.packages.find]
include = ["neuralmind*"]

[tool.setuptools.package-data]
neuralmind = [
  "knowledge/rules/*.lp",
  "self/profiles/*.lp",
  "self/weights/*.npz",
  "self/weights/*.json",
  "perception/weights/*.npz",
  "perception/weights/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
